################
# Openmanic Docker Compose template
#
# Use this template when enabling VAAPI Hardware accelerated encoding
#
# Variables that will need to be changed:
#     <PUID>                            -  User id for folder/file permissions
#     <PGID>                            -  Group id for folder/file permissions
#     <TZ>                              -  Your time zone, eg - Pacific/Auckland
#     <PATH_TO_CONFIG>                  -  Path where Openmanic will store config files
#     <PATH_TO_LIBRARY>                 -  Path where you store the files that Openmanic will scan
#     <PATH_TO_ENCODE_CACHE>            -  Cache path for in-progress encoding tasks
#


version: '2.4'

services:
  openmanic:
    container_name: openmanic
    # TODO(openmanic): no published Openmanic image yet; build one locally first with
    #   docker build -f docker/Dockerfile -t openmanic/openmanic:latest .
    image: openmanic/openmanic:latest
    ports:
      - 8888:8888
    environment:
      - PUID=<PUID>
      - PGID=<PGID>
      - TZ=<TZ>
    volumes:
      - <PATH_TO_CONFIG>:/config
      - <PATH_TO_LIBRARY>:/library
      - <PATH_TO_ENCODE_CACHE>:/tmp/unmanic
    devices:
      - /dev/dri:/dev/dri       # For H/W transcoding using the VAAPI encoder
